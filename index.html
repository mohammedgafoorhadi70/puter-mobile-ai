<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puter Mobile Dev Assistant</title>
<script src="https://js.puter.com/v2/"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#1b1a20;--border:#34313b;--text:#f4f2f7;--muted:#9c98a6;--accent:#a78bfa;--user:#34313d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}.top{display:flex;align-items:center;gap:10px}.title{font-size:20px;font-weight:750;flex:1}.btn,select{background:#292630;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;font:inherit}.btn{cursor:pointer}.btn:disabled{opacity:.45}.controls{display:flex;gap:8px;margin-top:10px}.controls select{flex:1;min-width:0}.status{font-size:12px;color:var(--muted);padding:8px 16px}.chat{flex:1;overflow-y:auto;padding:14px 14px 20px;scroll-behavior:smooth}.msg{padding:13px 14px;border-radius:17px;margin:10px 0;max-width:95%;overflow-wrap:anywhere;line-height:1.55;border:1px solid var(--border)}.msg.user{background:var(--user);margin-left:auto;border-color:transparent;white-space:pre-wrap}.msg.assistant{background:var(--panel);margin-right:auto}.msg p{margin:0 0 .7em}.msg p:last-child{margin-bottom:0}.msg ul,.msg ol{padding-left:1.4em}.msg pre{background:#0c0b10;border:1px solid #373440;border-radius:12px;padding:12px;overflow:auto;margin:10px 0}.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}.msg :not(pre)>code{background:#292630;padding:2px 5px;border-radius:5px}.msg pre code{white-space:pre}.code-head{display:flex;justify-content:flex-end;margin-bottom:6px}.copy{font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid #45414d;background:#25232b;color:#ddd;cursor:pointer}.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border)}textarea{width:100%;resize:none;max-height:160px;min-height:48px;background:#24222a;border:1px solid #484450;color:var(--text);border-radius:14px;padding:12px;font:inherit;outline:none}.row{display:flex;gap:8px;margin-top:8px}.row .btn.send{background:var(--accent);color:#1b1428;font-weight:700;border:0;min-width:76px}.row .btn.secondary{flex:1}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}@media(min-width:700px){.chat{padding:20px 24px}.msg{max-width:82%}}
</style>
</head><body><div class="app">
<header><div class="top"><div class="title">⚡ Dev Assistant</div><button class="btn" id="newChat" title="New chat">＋</button></div>
<div class="controls"><select id="model" aria-label="Choose model"><option value="claude-opus-5-5">Claude Opus 5.5</option><option value="claude-sonnet-5-5">Claude Sonnet 5.5</option><option value="claude-haiku-4-5">Claude Haiku 4.5</option><option value="gpt-5.4-nano">GPT 5.4 Nano</option></select><button class="btn" id="signin">Sign in</button></div>
<div class="controls"><select id="history" aria-label="Chat history"></select><button class="btn" id="deleteChat" title="Delete current chat">🗑</button></div></header>
<div class="status" id="status">Ready · Sign in to use AI</div><main class="chat" id="chat"></main>
<div class="composer"><textarea id="input" rows="1" placeholder="Ask about coding, debugging, architecture..." aria-label="Message"></textarea><div class="row"><button class="btn secondary" id="clear">Clear input</button><button class="btn send" id="send">Send</button></div><div class="foot">Puter AI · Chats saved on this device</div></div></div>
<script>
const $=id=>document.getElementById(id),chat=$('chat'),input=$('input'),status=$('status'),model=$('model'),historySelect=$('history');const STORAGE='puter_dev_assistant_chats_v2';let chats=[],activeId=null,busy=false,signedIn=false;
const systemPrompt=`You are a rigorous, expert software development assistant. Help with software architecture, coding, debugging, code review, testing, and learning. Be accurate, practical, and direct. For code, provide complete working examples when useful, explain assumptions, and never invent test results. If the user's idea or code is flawed, clearly explain why and offer a better solution.`;
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function active(){return chats.find(c=>c.id===activeId)}function save(){try{localStorage.setItem(STORAGE,JSON.stringify(chats))}catch{status.textContent='Unable to save history (storage may be full)'}}
function load(){try{chats=JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch{chats=[]}if(!Array.isArray(chats))chats=[];if(!chats.length)createChat(false);else{activeId=chats[0].id;renderChat()}}
function createChat(saveIt=true){let c={id:makeId(),title:'New chat',messages:[],created:Date.now()};chats.unshift(c);activeId=c.id;if(saveIt)save();renderChat();status.textContent='New conversation'}
function refreshHistory(){historySelect.innerHTML='';chats.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.title||'New chat';historySelect.appendChild(o)});historySelect.value=activeId}
function md(text){try{return DOMPurify.sanitize(marked.parse(text||''))}catch{return String(text)}}
function decorateCode(el){el.querySelectorAll('pre').forEach(pre=>{if(pre.querySelector('.code-head'))return;let wrap=document.createElement('div');wrap.className='code-head';let b=document.createElement('button');b.className='copy';b.textContent='Copy code';b.onclick=async()=>{try{await navigator.clipboard.writeText(pre.querySelector('code')?.innerText||pre.innerText);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy code',1200)}catch{b.textContent='Copy failed'}};wrap.appendChild(b);pre.insertBefore(wrap,pre.firstChild)})}
function renderChat(){chat.innerHTML='';let c=active();if(!c)return;if(!c.messages.length){let w=document.createElement('div');w.className='msg assistant';w.innerHTML='<p><strong>Development assistant ready.</strong></p><p>Ask me to debug code, review architecture, explain concepts, write tests, or plan a project.</p>';chat.appendChild(w)}c.messages.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'assistant');if(m.role==='user')d.textContent=m.text;else{d.innerHTML=md(m.text);decorateCode(d)}chat.appendChild(d)});chat.scrollTop=chat.scrollHeight;refreshHistory()}
function addUser(text){let c=active();c.messages.push({role:'user',text});if(c.title==='New chat'){c.title=text.slice(0,36)+(text.length>36?'…':'');refreshHistory()}save();renderChat()}
function busyState(v){busy=v;$('send').disabled=v;$('newChat').disabled=v;status.textContent=v?'Generating…':'Ready'}
async function send(){let text=input.value.trim();if(!text||busy)return;if(!signedIn){status.textContent='Sign in to Puter first';return}input.value='';input.style.height='48px';addUser(text);let c=active(),msgs=c.messages.map(m=>({role:m.role,content:m.text}));msgs.unshift({role:'system',content:systemPrompt});let div=document.createElement('div');div.className='msg assistant';chat.appendChild(div);busyState(true);let output='';try{let stream=await puter.ai.chat(msgs,{model:model.value,stream:true});for await(let part of stream){if(part.type==='text'){output+=part.text;div.innerHTML=md(output);decorateCode(div);chat.scrollTop=chat.scrollHeight}else if(part.type==='error'){throw new Error(part.error?.message||part.message||'Provider error')}}if(!output.trim())output='(Empty response)';c.messages.push({role:'assistant',text:output});save();renderChat();status.textContent='Completed'}catch(e){let error='**Error:** '+(e?.message||String(e));c.messages.push({role:'assistant',text:error});save();renderChat();status.textContent='Request failed'}finally{busyState(false)}}
$('send').onclick=send;$('newChat').onclick=()=>createChat();$('clear').onclick=()=>{input.value='';input.focus()};$('deleteChat').onclick=()=>{if(chats.length===1){chats[0].messages=[];chats[0].title='New chat'}else{chats=chats.filter(c=>c.id!==activeId);activeId=chats[0].id}save();renderChat();status.textContent='Chat deleted'};historySelect.onchange=()=>{activeId=historySelect.value;renderChat()};input.addEventListener('input',()=>{input.style.height='48px';input.style.height=Math.min(input.scrollHeight,160)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('signin').onclick=async()=>{try{await puter.auth.signIn();signedIn=true;$('signin').textContent='Signed in';status.textContent='Signed in · Ready'}catch(e){status.textContent='Sign-in failed: '+(e.message||e)}};load();
</script></body></html>
