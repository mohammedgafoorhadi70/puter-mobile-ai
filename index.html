<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puter Dev Assistant</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#1b1a20;--border:#35323d;--text:#f5f3f8;--muted:#a6a1af;--accent:#a78bfa;--user:#34313d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:flex;max-width:1100px;margin:auto}aside{width:270px;flex-shrink:0;background:#17161c;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:10px}.side-title{font-size:19px;font-weight:750;padding:4px}.btn{background:#292630;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:10px;font:inherit;cursor:pointer}.btn:disabled{opacity:.5}.new{width:100%;background:#302b3c}.history{overflow:auto;flex:1}.history-item{display:flex;align-items:center;gap:6px;margin:4px 0}.history-item button:first-child{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item button.active{background:#3b3548;border-color:#66567e}.del{padding:8px;color:#c5bccc}.main{min-width:0;flex:1;display:flex;flex-direction:column}header{padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}.headrow{display:flex;align-items:center;gap:10px}.title{font-weight:750;font-size:20px;flex:1}.select{margin-top:10px;width:100%;background:#292630;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:10px;font:inherit}.status{font-size:12px;color:var(--muted);padding:8px 14px}.chat{flex:1;overflow:auto;padding:12px 14px 20px}.msg{padding:13px 14px;border-radius:16px;margin:10px 0;max-width:96%;overflow-wrap:anywhere;line-height:1.6;border:1px solid var(--border)}.user{background:var(--user);margin-left:auto;border-color:transparent;white-space:pre-wrap}.assistant{background:var(--panel);margin-right:auto}.assistant p{margin:0 0 .7em}.assistant p:last-child{margin-bottom:0}.assistant h1,.assistant h2,.assistant h3{line-height:1.3}.assistant pre{background:#0b0a0e;border:1px solid #393541;border-radius:12px;padding:12px;overflow:auto;position:relative;margin:10px 0}.assistant code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}.assistant :not(pre)>code{background:#292630;padding:2px 5px;border-radius:5px}.assistant pre code{white-space:pre}.copyrow{display:flex;justify-content:flex-end;margin-bottom:6px}.copycode{font-size:12px;padding:5px 9px;border:1px solid #48434f;border-radius:7px;background:#27252c;color:#ddd}.composer{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border)}textarea{width:100%;min-height:52px;max-height:180px;resize:vertical;background:#24222a;color:var(--text);border:1px solid #484450;border-radius:14px;padding:12px;font:inherit}.actions{display:flex;gap:8px;margin-top:8px}.actions .send{background:var(--accent);color:#20172b;border:0;font-weight:750;min-width:80px}.actions .clear{flex:1}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}.mobilehistory{display:none}
@media(max-width:650px){.app{height:100dvh}aside{width:230px;position:fixed;z-index:5;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 30px #0005}.app.sidebar-open aside{transform:translateX(0)}.mobilehistory{display:inline-block}.title{font-size:18px}.chat{padding:10px}.msg{max-width:97%}}
</style></head>
<body><div class="app" id="app">
<aside><div class="side-title">⚡ Chats</div><button class="btn new" id="newchat">＋ New chat</button><div class="history" id="history"></div><button class="btn" id="closeSide">Close menu</button></aside>
<div class="main"><header><div class="headrow"><button class="btn mobilehistory" id="menu">☰</button><div class="title">AI Development Assistant</div><button class="btn" id="newtop" title="New chat">＋</button></div><select class="select" id="model"><option value="claude-opus-5-5">Claude Opus 5.5</option><option value="claude-sonnet-5-5">Claude Sonnet 5.5</option><option value="claude-haiku-4-5">Claude Haiku 4.5</option><option value="gpt-5.4-nano">GPT 5.4 Nano</option></select><button class="btn" id="signin" style="width:100%;margin-top:8px">Sign in to Puter</button></header>
<div class="status" id="status">Ready · Sign in to Puter</div><main class="chat" id="chat"></main><div class="composer"><textarea id="input" placeholder="Message… (paste inserts; it will not send)" rows="2"></textarea><div class="actions"><button class="btn clear" id="clear">Clear input</button><button class="btn send" id="send">Send</button></div><div class="foot">Puter AI · Conversation history saved locally on this device</div></div></div></div>
<script>
const $=s=>document.getElementById(s),chat=$('chat'),input=$('input'),historyBox=$('history'),status=$('status'),model=$('model'),app=$('app');const STORE='puter_dev_chats_v3';let conversations=[],currentId=null,busy=false,signedIn=false;
const system=`You are a skilled, rigorous software development assistant. Help with architecture, implementation, debugging, code review, testing, and learning. Maintain continuity using the full conversation history supplied to you. Do not claim code was run or verified unless it actually was. Be clear, structured, and concise but complete. For code, use fenced code blocks with a language label. If earlier context is missing, say so rather than inventing it.`;
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function active(){return conversations.find(c=>c.id===currentId)}function persist(){try{localStorage.setItem(STORE,JSON.stringify(conversations))}catch(e){status.textContent='Storage error: chat may be too large to save'}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'[]');conversations=Array.isArray(v)?v:[]}catch{conversations=[]}if(!conversations.length)newChat(false);else{currentId=conversations[0].id;draw()}}
function newChat(save=true){const c={id:makeId(),title:'New chat',messages:[],created:Date.now()};conversations.unshift(c);currentId=c.id;if(save)persist();draw();status.textContent='New chat';closeSidebar()}
function closeSidebar(){app.classList.remove('sidebar-open')}function safeMarkdown(t){return DOMPurify.sanitize(marked.parse(t||''))}
function renderHistory(){historyBox.innerHTML='';conversations.forEach(c=>{const row=document.createElement('div');row.className='history-item';const b=document.createElement('button');b.className='btn'+(c.id===currentId?' active':'');b.textContent=c.title||'New chat';b.onclick=()=>{currentId=c.id;draw();closeSidebar()};const d=document.createElement('button');d.className='btn del';d.textContent='×';d.title='Delete chat';d.onclick=()=>{if(!confirm('Delete this conversation?'))return;conversations=conversations.filter(x=>x.id!==c.id);if(!conversations.length)newChat(false);else if(currentId===c.id)currentId=conversations[0].id;persist();draw()};row.append(b,d);historyBox.appendChild(row)})}
function decorate(el){el.querySelectorAll('pre').forEach(pre=>{if(pre.querySelector('.copyrow'))return;const row=document.createElement('div');row.className='copyrow';const btn=document.createElement('button');btn.className='copycode';btn.textContent='Copy code';btn.onclick=async()=>{try{await navigator.clipboard.writeText(pre.querySelector('code')?.innerText||pre.innerText);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy code',1200)}catch{btn.textContent='Copy failed'}};row.append(btn);pre.insertBefore(row,pre.firstChild)})}
function draw(){chat.innerHTML='';const c=active();if(!c)return;if(!c.messages.length){const welcome=document.createElement('div');welcome.className='msg assistant';welcome.innerHTML='<p><strong>Development assistant ready.</strong></p><p>Ask about code, debugging, design, architecture, testing, or learning. Your chats are saved locally.</p>';chat.append(welcome)}c.messages.forEach(m=>{const el=document.createElement('div');el.className='msg '+m.role;if(m.role==='user')el.textContent=m.content;else{el.innerHTML=safeMarkdown(m.content);decorate(el)}chat.append(el)});chat.scrollTop=chat.scrollHeight;renderHistory()}
function addUser(text){const c=active();c.messages.push({role:'user',content:text});if(c.title==='New chat')c.title=text.replace(/\s+/g,' ').slice(0,40)+(text.length>40?'…':'');persist();draw()}
function setBusy(v){busy=v;$('send').disabled=v;$('newchat').disabled=v;$('newtop').disabled=v;status.textContent=v?'Generating…':'Ready'}
async function send(){const text=input.value.trim();if(!text||busy)return;if(!signedIn){status.textContent='Please sign in to Puter first';return}input.value='';input.style.height='auto';addUser(text);const c=active();const messages=[{role:'system',content:system},...c.messages.map(m=>({role:m.role,content:m.content}))];const answer=document.createElement('div');answer.className='msg assistant';chat.append(answer);setBusy(true);let out='';try{const stream=await puter.ai.chat(messages,{model:model.value,stream:true});for await(const chunk of stream){if(chunk.type==='text'){out+=chunk.text;answer.innerHTML=safeMarkdown(out);decorate(answer);chat.scrollTop=chat.scrollHeight}else if(chunk.type==='error')throw new Error(chunk.error?.message||chunk.message||'Provider returned an error')}if(!out.trim())out='(Empty response)';c.messages.push({role:'assistant',content:out});persist();draw();status.textContent='Completed'}catch(e){out='**Request failed:** '+(e.message||String(e));c.messages.push({role:'assistant',content:out});persist();draw();status.textContent='Request failed'}finally{setBusy(false)}}
$('send').onclick=send;$('newchat').onclick=()=>newChat();$('newtop').onclick=()=>newChat();$('clear').onclick=()=>{input.value='';input.focus()};$('menu').onclick=()=>app.classList.toggle('sidebar-open');$('closeSide').onclick=closeSidebar;input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('paste',()=>{status.textContent='Pasted text inserted · tap Send when ready';setTimeout(()=>{if(!busy)status.textContent='Ready'},1800)});$('signin').onclick=async()=>{try{await puter.auth.signIn();signedIn=true;$('signin').textContent='Signed in';status.textContent='Signed in · Ready'}catch(e){status.textContent='Sign-in failed: '+(e.message||e)}};load();
</script></body></html>
